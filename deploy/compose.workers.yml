name: pump-paper-workers

services:
  collector:
    image: ${PUMP_IMAGE:?Set the tested release image}
    container_name: pump-collector
    restart: unless-stopped
    init: true
    mem_limit: 6g
    cpus: 4.0
    stop_grace_period: 45s
    environment:
      PUMP_LEDGER_BACKEND: ${PUMP_LEDGER_BACKEND:-sqlite}
    command: [python3, paper_trader.py, live, --config, /app/paper.cadence.config.json, --db, /app/data/cadence.sqlite, --no-dashboard, --publish-registry]
    env_file:
      - path: ${PUMP_DATA_DIR:?Set persistent data directory}/service.env
        required: false
    volumes:
      - ${PUMP_DATA_DIR}:/app/data
    networks: [public-proxy]
    ulimits:
      nofile: {soft: 8192, hard: 8192}
    healthcheck:
      test: [CMD, python3, -c, "import json,time; d=json.load(open('/app/data/public-registry.json')); assert d['workers_alive'] and 0<=time.time()-d['at']<30 and time.time()-d['timing'].get('completed_at',0)<180"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=64m,mode=1777"]

  public:
    image: ${PUMP_IMAGE:?Set the tested release image}
    container_name: pump-paper
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    environment:
      PUMP_LEDGER_BACKEND: ${PUMP_LEDGER_BACKEND:-sqlite}
    env_file:
      - path: ${PUMP_DATA_DIR}/public-service.env
        required: false
    command: [python3, -m, paper.public_worker, --bind, 0.0.0.0]
    volumes:
      - ${PUMP_DATA_DIR}:/app/data:ro
    ports: ["127.0.0.1:8765:8765"]
    networks: [public-proxy]
    ulimits:
      nofile: {soft: 8192, hard: 8192}
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/public/health',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "3"}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=64m,mode=1777"]

networks:
  public-proxy:
    external: true
    name: insidedb_insidedb-network

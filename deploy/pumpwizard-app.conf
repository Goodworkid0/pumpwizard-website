# These zones belong in the http context, alongside (not inside) server blocks.
# Per-IP limits use the socket peer. Configure trusted real-IP ranges separately
# if Cloudflare is enabled; never trust arbitrary X-Forwarded-For headers.
limit_req_zone $binary_remote_addr zone=pump_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pump_export:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=pump_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name pumpwizard.fun www.pumpwizard.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pumpwizard.fun$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pumpwizard.fun;

    ssl_certificate /etc/letsencrypt/live/pumpwizard.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pumpwizard.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://pumpwizard.fun$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pumpwizard.fun;

    # Cloudflare published ranges verified 2026-09-13; scoped to this vhost only.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    ssl_certificate /etc/letsencrypt/live/pumpwizard.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pumpwizard.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn pump_connections 20;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;

    location ~ ^/api/public/(history|research)\.(csv|jsonl\.gz)$ {
        limit_except GET { deny all; }
        limit_req zone=pump_export burst=2 nodelay;
        set $pump_upstream pump-paper:8765;
        proxy_pass http://$pump_upstream;
        proxy_set_header Host 127.0.0.1:8765;
    }

    location ~ "^/api/public/packages/[a-f0-9]{64}\.zip$" {
        limit_except GET { deny all; }
        limit_req zone=pump_export burst=2 nodelay;
        set $pump_upstream pump-paper:8765;
        proxy_pass http://$pump_upstream;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location ~ "^/api/public/(summary|catalog|research|live-feed|community|health|packages|strategies/[a-z0-9-]{1,40}(/trades)?)$" {
        limit_except GET { deny all; }
        limit_req zone=pump_api burst=30 nodelay;
        set $pump_upstream pump-paper:8765;
        proxy_pass http://$pump_upstream;
        proxy_set_header Host 127.0.0.1:8765;
    }

    # Static requests remain bounded by connection limits, not API rate buckets.
    location ~ "^/[a-z-]+\\.(js|css)$" {
        limit_except GET { deny all; }
        set $pump_upstream pump-paper:8765;
        proxy_pass http://$pump_upstream;
        proxy_set_header Host 127.0.0.1:8765;
    }

    location ~ "^/assets/(brand/option-b-orbital-spark-logo-512\\.png|pump-logomark\\.svg|raydium-logomark\\.svg)$" {
        limit_except GET { deny all; }
        set $pump_upstream pump-paper:8765;
        proxy_pass http://$pump_upstream;
        proxy_set_header Host 127.0.0.1:8765;
    }

    # Positive allowlist: unknown APIs, operator pages and data paths never proxy.
    location ~ "^/($|engine(/[a-z0-9-]{1,40})?$|strategies(/[a-z0-9-]{1,40})?$|research$|downloads$|socials$|affiliate$|contact$|legal$|[a-z-]+\.(js|css)$)" {
        limit_except GET { deny all; }
        limit_req zone=pump_api burst=30 nodelay;
        set $pump_upstream pump-paper:8765;
        proxy_pass http://$pump_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}

name: pump-paper

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pump-paper:local
    container_name: pump-paper
    restart: unless-stopped
    init: true
    mem_limit: 6g
    cpus: 4.0
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    command:
      - python3
      - paper_trader.py
      - live
      - --config
      - /app/paper.cadence.config.json
      - --db
      - /app/data/cadence.sqlite
      - --port
      - "8765"
      - --bind
      - 0.0.0.0
    env_file:
      - path: ${PUMP_DATA_DIR:-../data}/service.env
        required: false
    volumes:
      - ${PUMP_DATA_DIR:-../data}:/app/data
    expose:
      - "8765"
    networks:
      - public-proxy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8765/api/public/health',
          headers={'Host':'127.0.0.1:8765'}), timeout=5)
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 180s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777

networks:
  public-proxy:
    external: true
    name: insidedb_insidedb-network
